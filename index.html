<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Lista de Tarefas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #000000;
      color: white;
      padding: 20px;
      border-bottom: 5px solid #d71920;
    }

    main {
      background-color: #ffffff;
      width: 90%;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 12px #999;
      border: 2px solid #000000;
    }

    h2 {
      color: #000000;
    }

    input {
      padding: 10px;
      width: 70%;
      border: 1px solid #777;
      border-radius: 6px;
    }

    button {
      padding: 10px;
      border: none;
      background-color: #000000;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #333333;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background-color: #e6e6e6;
      margin: 8px 0;
      padding: 10px;
      border-radius: 6px;
      border-left: 5px solid #d71920;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .concluida {
      text-decoration: line-through;
      color: gray;
    }

    .remover {
      background-color: #d71920;
    }

    .remover:hover {
      background-color: #a60000;
    }

    footer {
      margin-top: 30px;
      color: #333;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Minha Lista de Tarefas</h1>
    <p>Projeto simples em HTML, CSS e JavaScript</p>
  </header>

  <main>
    <h2>Adicionar tarefa</h2>

    <input type="text" id="tarefa" placeholder="Digite uma tarefa">
    <button onclick="adicionarTarefa()">Adicionar</button>

    <ul id="lista"></ul>
  </main>

  <footer>
    <p>Desenvolvido para aula prática</p>
  </footer>

  <script>
    function adicionarTarefa() {
      var input = document.getElementById("tarefa");
      var texto = input.value;

      if (texto === "") {
        alert("Digite uma tarefa antes de adicionar.");
        return;
      }

      var lista = document.getElementById("lista");

      var item = document.createElement("li");

      var span = document.createElement("span");
      span.textContent = texto;

      span.onclick = function() {
        span.classList.toggle("concluida");
      };

      var botao = document.createElement("button");
      botao.textContent = "Excluir";
      botao.className = "remover";

      botao.onclick = function() {
        lista.removeChild(item);
      };

      item.appendChild(span);
      item.appendChild(botao);

      lista.appendChild(item);

      input.value = "";
    }
  </script>

</body>
</html>
