<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Lista de Tarefas</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff0f6;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #ff69b4;
      color: white;
      padding: 20px;
    }

    main {
      background-color: #ffffff;
      width: 90%;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 12px #f3b6d2;
    }

    h2 {
      color: #c71585;
    }

    input {
      padding: 10px;
      width: 70%;
      border: 1px solid #ffb6c1;
      border-radius: 8px;
    }

    button {
      padding: 10px;
      border: none;
      background-color: #da70d6;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #ba55d3;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    li {
      background-color: #ffe4ec;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .concluida {
      text-decoration: line-through;
      color: gray;
    }

    .remover {
      background-color: #ff4f81;
    }

    .remover:hover {
      background-color: #e6005c;
    }

    footer {
      margin-top: 30px;
      color: #a0527d;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Minha Lista de Tarefas</h1>
    <p>Projeto simples em HTML, CSS e JavaScript</p>
  </header>

  <main>
    <h2>Adicionar tarefa</h2>

    <input type="text" id="tarefa" placeholder="Digite uma tarefa">
    <button onclick="adicionarTarefa()">Adicionar</button>

    <ul id="lista"></ul>
  </main>

  <footer>
    <p>Desenvolvido para aula prática</p>
  </footer>

  <script>
    function adicionarTarefa() {
      var input = document.getElementById("tarefa");
      var texto = input.value;

      if (texto === "") {
        alert("Digite uma tarefa antes de adicionar.");
        return;
      }

      var lista = document.getElementById("lista");

      var item = document.createElement("li");

      var span = document.createElement("span");
      span.textContent = texto;

      span.onclick = function() {
        span.classList.toggle("concluida");
      };

      var botao = document.createElement("button");
      botao.textContent = "Excluir";
      botao.className = "remover";

      botao.onclick = function() {
        lista.removeChild(item);
      };

      item.appendChild(span);
      item.appendChild(botao);

      lista.appendChild(item);

      input.value = "";
    }
  </script>

</body>
</html>
